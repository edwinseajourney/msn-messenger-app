<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSN Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Tahoma, "MS Sans Serif", sans-serif;
      font-size: 11px;
      background: #245edb url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="%23245edb"/><rect width="2" height="2" fill="%233a6ea5"/></svg>') repeat;
      user-select: none;
    }

    #desktop {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .msn-window {
      position: fixed;
      background: #ece9d8;
      border: 1px solid #0054e3;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      min-width: 220px;
    }

    .msn-window.active { z-index: 200; }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 22px;
      padding: 0 2px 0 4px;
      background: linear-gradient(180deg, #0997ff 0%, #0053ee 8%, #0050ee 40%, #06f 88%, #06f 93%, #005bff 95%, #003dd7 96%, #003dd7 100%);
      color: #fff;
      font-weight: bold;
      font-size: 11px;
      cursor: default;
    }

    .titlebar.inactive {
      background: linear-gradient(180deg, #7eb4ea 0%, #5a9fd4 45%, #3d8fd4 100%);
    }

    .titlebar-text {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
      pointer-events: none;
    }

    .titlebar-btns { display: flex; gap: 2px; }

    .win-btn {
      width: 21px;
      height: 21px;
      border: 1px solid #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      background: #ece9d8;
      color: #000;
      font-size: 10px;
      line-height: 17px;
      text-align: center;
      cursor: pointer;
      font-family: Tahoma, sans-serif;
      padding: 0;
    }

    .win-btn:active {
      border: 1px solid #404040;
      border-right-color: #fff;
      border-bottom-color: #fff;
    }

    .win-btn.close { font-weight: bold; }

    .window-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Buddy list — vast aan rechterkant, volledige hoogte */
    #buddy-window {
      width: 280px;
      right: 0;
      top: 0;
      bottom: 0;
      left: auto;
      height: 100%;
      border-right: none;
    }

    #buddy-window .window-body {
      flex: 1;
      min-height: 0;
    }

    .buddy-header {
      background: linear-gradient(180deg, #fff 0%, #ece9d8 100%);
      padding: 8px 10px;
      border-bottom: 1px solid #aca899;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .buddy-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      background: linear-gradient(135deg, #0997ff, #003dd7);
      border: 2px solid #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.2);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      overflow: hidden;
    }

    .buddy-avatar:hover { outline: 1px dotted #003399; }

    .profile-panel {
      display: none;
      padding: 8px 10px;
      background: #fff;
      border-bottom: 1px solid #aca899;
    }

    .profile-panel.open { display: block; }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }

    .avatar-thumb {
      width: 40px;
      height: 40px;
      border: 2px solid #aca899;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background-size: cover;
      background-position: center;
      background-color: #ece9d8;
    }

    .avatar-thumb:hover { border-color: #316ac5; }
    .avatar-thumb.selected { border-color: #0054e3; }

    .profile-custom .xp-btn { width: 100%; font-size: 10px; }

    .buddy-me strong { font-size: 12px; color: #003399; }
    .buddy-me span { color: #666; font-size: 10px; }

    .buddy-search {
      margin: 6px 8px;
      padding: 3px 6px;
      border: 1px solid #7f9db9;
      font-family: Tahoma, sans-serif;
      font-size: 11px;
      width: calc(100% - 16px);
    }

    .buddy-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 8px;
      min-height: 0;
    }

    .buddy-group-title {
      padding: 4px 10px 2px;
      font-weight: bold;
      color: #003399;
      font-size: 11px;
    }

    .buddy-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px 3px 20px;
      cursor: pointer;
    }

    .buddy-item:hover,
    .buddy-item.selected { background: #316ac5; color: #fff; }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.2);
    }

    .status-online { background: #3cbc3c; }
    .status-away { background: #ffcc00; }
    .status-busy { background: #ff3333; }

    .buddy-footer {
      border-top: 1px solid #aca899;
      padding: 6px 8px;
      display: flex;
      gap: 4px;
      background: #ece9d8;
    }

    .xp-btn {
      padding: 3px 12px;
      border: 1px solid #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      background: #ece9d8;
      font-family: Tahoma, sans-serif;
      font-size: 11px;
      cursor: pointer;
    }

    .xp-btn:active {
      border: 1px solid #404040;
      border-right-color: #fff;
      border-bottom-color: #fff;
      padding: 4px 11px 2px 13px;
    }

    /* Chat window — groot, links van de buddy list */
    .chat-window {
      width: min(480px, calc(100vw - 300px));
      height: min(620px, calc(100vh - 32px));
      left: 24px;
      top: 16px;
    }

    .chat-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      background: #ece9d8;
      border-bottom: 1px solid #aca899;
    }

    .chat-toolbar .xp-btn { font-size: 10px; padding: 2px 8px; }
    .chat-toolbar .xp-btn.active { background: #d4e8ff; }

    .chat-panel {
      display: none;
      padding: 6px 8px;
      background: #fff;
      border-bottom: 1px solid #aca899;
      max-height: 140px;
      overflow-y: auto;
    }

    .chat-panel.open { display: block; }

    .bg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .bg-thumb {
      aspect-ratio: 4/3;
      border: 2px solid #aca899;
      border-radius: 3px;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .bg-thumb:hover { border-color: #316ac5; }
    .bg-thumb.selected { border-color: #0054e3; box-shadow: 0 0 0 1px #0054e3; }

    .bg-thumb span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 9px;
      padding: 2px 4px;
      text-align: center;
    }

    .bg-thumb.bg-white { background: #fff; }
    .bg-custom-row { margin-top: 6px; }
    .bg-custom-row .xp-btn { width: 100%; font-size: 10px; }
    .bg-file-input { display: none; }

    .emoticon-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
    }

    .emoticon-btn {
      width: 28px;
      height: 28px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      border-radius: 3px;
      padding: 0;
      line-height: 28px;
    }

    .emoticon-btn:hover {
      border-color: #aca899;
      background: #e8f4ff;
    }

    .chat-messages-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin: 6px 8px;
      border: 1px inset #aca899;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      background: #fff;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-size: 11px;
      line-height: 1.45;
      user-select: text;
      min-height: 0;
    }

    .chat-messages.has-bg .msg-line,
    .chat-messages.has-bg .msg-system {
      background: rgba(255, 255, 255, 0.82);
      padding: 3px 6px;
      border-radius: 3px;
      display: inline-block;
      max-width: 100%;
    }

    .msg-line { margin-bottom: 6px; word-wrap: break-word; }
    .msg-emoji { font-size: 16px; vertical-align: middle; }

    .msg-image {
      display: block;
      margin-top: 4px;
      max-width: min(220px, 100%);
      border: 2px solid #aca899;
      border-radius: 4px;
      cursor: pointer;
    }

    .msg-file {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 4px 8px;
      background: #e8f4ff;
      border: 1px solid #7f9db9;
      border-radius: 3px;
      color: #003399;
      text-decoration: none;
      font-size: 11px;
    }

    .msg-file:hover { background: #d4e8ff; }

    .msg-caption { display: block; margin-top: 2px; }
    .msg-time { color: #888; font-size: 10px; margin-right: 4px; }
    .msg-name { font-weight: bold; }
    .msg-name.me { color: #003399; }
    .msg-name.them { color: #cc0000; }
    .msg-system { color: #666; font-style: italic; font-size: 10px; text-align: center; margin: 8px 0; }

    .typing-indicator {
      padding: 2px 10px 6px;
      color: #666;
      font-style: italic;
      font-size: 10px;
      min-height: 18px;
    }

    .typing-indicator.active { color: #003399; }

    .chat-input-area {
      border-top: 1px solid #aca899;
      padding: 6px 8px 8px;
      background: #ece9d8;
    }

    .chat-input-row { display: flex; gap: 4px; align-items: flex-end; }

    .chat-input-tools {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .chat-tool-btn {
      width: 28px;
      height: 24px;
      padding: 0;
      font-size: 14px;
      line-height: 22px;
      min-width: 28px;
    }

    .chat-tool-btn.active { background: #d4e8ff; }

    .chat-input-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .chat-input-panel {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      margin-bottom: 4px;
      padding: 6px;
      background: #fff;
      border: 1px solid #aca899;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      max-height: 120px;
      overflow-y: auto;
      z-index: 10;
    }

    .chat-input-panel.open { display: block; }

    .chat-input {
      flex: 1;
      height: 52px;
      width: 100%;
      resize: none;
      border: 1px inset #aca899;
      font-family: Tahoma, sans-serif;
      font-size: 11px;
      padding: 4px 6px;
      user-select: text;
    }

  .chat-input:focus { outline: 1px dotted #000; }

    .send-btn {
      height: 52px;
      min-width: 56px;
    }

    .nudge-btn { background: #ffffcc; }

    @keyframes nudge-shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-8px, -4px) rotate(-2deg); }
      20% { transform: translate(8px, 4px) rotate(2deg); }
      30% { transform: translate(-10px, 2px) rotate(-3deg); }
      40% { transform: translate(10px, -2px) rotate(3deg); }
      50% { transform: translate(-8px, 4px) rotate(-2deg); }
      60% { transform: translate(8px, -4px) rotate(2deg); }
      70% { transform: translate(-6px, 0) rotate(-1deg); }
      80% { transform: translate(6px, 0) rotate(1deg); }
      90% { transform: translate(-4px, 2px); }
    }

    .msn-window.nudging {
      animation: nudge-shake 0.55s ease-in-out;
    }

    .hidden { display: none !important; }
    .minimized .window-body { display: none; }

    .statusbar {
      padding: 2px 8px;
      border-top: 1px solid #aca899;
      background: #ece9d8;
      color: #666;
      font-size: 10px;
    }
  </style>
</head>
<body>
<div id="desktop">

<div id="buddy-window" class="msn-window active" style="z-index: 50;">
  <div class="titlebar" data-drag="buddy-window">
    <span class="titlebar-text">MSN Messenger</span>
    <div class="titlebar-btns">
      <button class="win-btn" type="button" title="Minimaliseren" data-minimize="buddy-window">_</button>
      <button class="win-btn close" type="button" title="Sluiten" disabled>×</button>
    </div>
  </div>
  <div class="window-body">
    <div class="buddy-header">
      <div class="buddy-avatar" id="my-avatar" title="Klik om profielfoto te wijzigen">😎</div>
      <div class="buddy-me">
        <strong>Jij</strong><br />
        <span>● Online</span>
      </div>
    </div>
    <div class="profile-panel" id="profile-panel"></div>
    <input type="text" class="buddy-search" placeholder="Contact zoeken..." readonly />
    <div class="buddy-list" id="buddy-list"></div>
    <div class="buddy-footer">
      <button class="xp-btn" type="button" disabled>Toevoegen</button>
      <button class="xp-btn" type="button" disabled>Opties</button>
    </div>
    <div class="statusbar">MSN Messenger</div>
  </div>
</div>

</div><!-- #desktop -->

<script>
const API_URL = 'http://localhost:3000/api/chat';
const MODEL = 'claude-haiku-4-5-20251001';

const CONTACTS = [
  {
    id: 'claude',
    name: 'Claude AI',
    emoji: '🤖',
    status: 'online',
    statusLabel: 'Online',
    system: `Je bent Claude AI in een MSN Messenger replica uit 2005. Je bent behulpzaam, vriendelijk en antwoordt kort (1-3 zinnen) in het Nederlands, tenzij de gebruiker Engels spreekt. Gebruik af en toe een :) of ;) zoals in MSN-tijd.`,
  },
  {
    id: 'lisa',
    name: 'Lisa',
    emoji: '👩',
    status: 'online',
    statusLabel: 'Luistert naar Taylor Swift',
    system: `Je bent Lisa, een Nederlandse tiener van 16 jaar in MSN Messenger (2005). Je bent gek op Taylor Swift — noem af en toe nummers zoals Love Story of You Belong With Me. Gebruik tiener-taal: omg, lol, ff, idk, xoxo. Antwoord kort en enthousiast in het Nederlands.`,
  },
  {
    id: 'jeroen',
    name: 'Jeroen',
    emoji: '🎮',
    status: 'away',
    statusLabel: 'In CS 1.6',
    system: `Je bent Jeroen, een gamer in MSN Messenger (2005). Je speelt vooral Counter-Strike 1.6 — praat over de_dust2, AWP, rush B, noobs, en lag. Antwoord kort in het Nederlands met gamer-slang. Soms ben je midden in een match.`,
  },
  {
    id: 'sanne',
    name: 'Sanne',
    emoji: '🌸',
    status: 'busy',
    statusLabel: 'Bezet',
    system: `Je bent Sanne in MSN Messenger (2005). Je bent dramatisch en zegt vaak dat je BEZET bent, maar je reageert toch altijd meteen. Begin regelmatig met zinnen als "omg ik ben ZO druk maar...", "kan ff niet maar...", of "waarom stuur je nu?!". Antwoord kort, emotioneel, in het Nederlands.`,
  },
];

const conversations = {};
const chatWindows = {};
let topZ = 50;
let windowOffset = 0;

const PRESET_AVATARS = [
  { id: 'emoji-cool', emoji: '😎' },
  { id: 'emoji-smile', emoji: '😊' },
  { id: 'emoji-nerd', emoji: '🤓' },
  { id: 'emoji-cat', emoji: '😺' },
  { id: 'emoji-penguin', emoji: '🐧' },
  { id: 'emoji-star', emoji: '🌟' },
  { id: 'avatar-blue', file: 'avatars/blue.svg' },
  { id: 'avatar-pink', file: 'avatars/pink.svg' },
  { id: 'avatar-green', file: 'avatars/green.svg' },
  { id: 'avatar-purple', file: 'avatars/purple.svg' },
];

const MY_AVATAR_KEY = 'msn-my-avatar';
const MAX_FILE_SIZE = 5 * 1024 * 1024;

const PRESET_BACKGROUNDS = [
  { id: 'white', name: 'Wit', style: 'background:#fff', thumbClass: 'bg-white' },
  { id: 'bliss', name: 'Bliss XP', file: 'backgrounds/bliss.svg' },
  { id: 'hearts', name: 'Hartjes', file: 'backgrounds/hearts.svg' },
  { id: 'stars', name: 'Sterren', file: 'backgrounds/stars.svg' },
  { id: 'bubbles', name: 'Bubbels', file: 'backgrounds/bubbles.svg' },
  { id: 'neon', name: 'Neon MSN', file: 'backgrounds/neon.svg' },
  { id: 'flowers', name: 'Bloemen', file: 'backgrounds/flowers.svg' },
];

const EMOTICONS = [
  '😀', '😂', '😊', '😉', '😍', '😘', '😎', '🤔',
  '😢', '😭', '😡', '😴', '🙄', '😬', '🥳', '🤗',
  '👍', '👎', '👋', '🙏', '💪', '✌️', '🤞', '👏',
  '❤️', '💔', '💕', '🔥', '⭐', '✨', '🎉', '🎮',
  '🌸', '🌈', '☀️', '🌙', '💤', '💬', '📱', '🎵',
];

const EMOTICON_SHORTCUTS = [
  [":'(", '😭'],
  [':-D', '😀'], [':D', '😀'],
  [':-P', '😛'], [':P', '😛'],
  [':-O', '😮'], [':O', '😮'], [':o', '😮'],
  [';-)', '😉'], [';)', '😉'],
  [':-)', '😊'], [':)', '😊'],
  [':-(', '😢'], [':(', '😢'],
  [':-*', '😘'], [':*', '😘'],
  ['B-)', '😎'], ['B)', '😎'],
  [':-|', '😐'], [':|', '😐'],
  ['(L)', '❤️'], ['<3', '❤️'],
  ['xD', '🤣'], ['XD', '🤣'],
  [':\\', '😕'], [':/', '😕'],
  ['^^', '😄'],
];

CONTACTS.forEach((c) => {
  conversations[c.id] = [];
});

function formatTime(date = new Date()) {
  return date.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function assetPath(relative) {
  const href = window.location.href.split('#')[0].split('?')[0];
  const base = href.endsWith('/') ? href : href.replace(/[^/]+$/, '');
  return base + relative;
}

function bgStorageKey(contactId) {
  return `msn-chat-bg-${contactId}`;
}

function getChatBackground(contactId) {
  try {
    return localStorage.getItem(bgStorageKey(contactId));
  } catch {
    return null;
  }
}

function setChatBackground(contactId, value) {
  try {
    if (value) localStorage.setItem(bgStorageKey(contactId), value);
    else localStorage.removeItem(bgStorageKey(contactId));
  } catch (e) {
    console.warn('Achtergrond opslaan mislukt:', e);
  }
  applyChatBackground(contactId);
}

function applyChatBackground(contactId) {
  const area = document.getElementById('msgs-' + contactId);
  if (!area) return;

  const saved = getChatBackground(contactId);
  area.classList.remove('has-bg');
  area.style.backgroundImage = '';
  area.style.backgroundColor = '#fff';

  if (!saved || saved === 'white') return;

  area.classList.add('has-bg');
  if (saved.startsWith('data:') || saved.startsWith('http') || saved.startsWith('file:')) {
    area.style.backgroundImage = `url(${JSON.stringify(saved)})`;
  } else if (saved.startsWith('preset:')) {
    const id = saved.slice(7);
    const preset = PRESET_BACKGROUNDS.find((p) => p.id === id);
    if (preset?.file) {
      area.style.backgroundImage = `url("${assetPath(preset.file)}")`;
    } else if (preset?.style) {
      area.classList.remove('has-bg');
      area.style.background = preset.style.replace('background:', '');
    }
  }
}

function formatMessageContent(text) {
  let safe = escapeHtml(text);
  const placeholders = [];
  EMOTICON_SHORTCUTS.forEach(([shortcut, emoji], i) => {
    const key = `__EMO_${i}__`;
    const escaped = shortcut.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (safe.includes(shortcut)) {
      safe = safe.replace(new RegExp(escaped, 'g'), key);
      placeholders.push([key, `<span class="msg-emoji">${emoji}</span>`]);
    }
  });
  placeholders.forEach(([key, emoji]) => {
    safe = safe.replaceAll(key, emoji);
  });
  return safe;
}

function insertAtCursor(textarea, text) {
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const before = textarea.value.slice(0, start);
  const after = textarea.value.slice(end);
  textarea.value = before + text + after;
  const pos = start + text.length;
  textarea.selectionStart = textarea.selectionEnd = pos;
  textarea.focus();
}

function closeChatPanels(exceptPanel) {
  document.querySelectorAll('.chat-panel, .chat-input-panel').forEach((p) => {
    if (p !== exceptPanel) p.classList.remove('open');
  });
  document.querySelectorAll('[data-panel-toggle], [data-input-panel-toggle]').forEach((btn) => {
    const panelId = btn.dataset.panelToggle || btn.dataset.inputPanelToggle;
    if (!exceptPanel || panelId !== exceptPanel.dataset.panel) {
      btn.classList.remove('active');
    }
  });
}

function getMyAvatar() {
  try {
    return localStorage.getItem(MY_AVATAR_KEY);
  } catch {
    return null;
  }
}

function setMyAvatar(value) {
  try {
    if (value) localStorage.setItem(MY_AVATAR_KEY, value);
    else localStorage.removeItem(MY_AVATAR_KEY);
  } catch (e) {
    console.warn('Profielfoto opslaan mislukt:', e);
  }
  applyMyAvatar();
}

function resolveAvatarDisplay(saved) {
  if (!saved || saved === 'default') return { type: 'emoji', value: '😎' };
  if (saved.startsWith('emoji:')) return { type: 'emoji', value: saved.slice(6) };
  if (saved.startsWith('preset:')) {
    const id = saved.slice(7);
    const preset = PRESET_AVATARS.find((a) => a.id === id);
    if (preset?.emoji) return { type: 'emoji', value: preset.emoji };
    if (preset?.file) return { type: 'image', value: assetPath(preset.file) };
  }
  if (saved.startsWith('data:') || saved.startsWith('http')) {
    return { type: 'image', value: saved };
  }
  return { type: 'emoji', value: '😎' };
}

function applyAvatarToEl(el, saved) {
  if (!el) return;
  const av = resolveAvatarDisplay(saved);
  el.textContent = '';
  if (av.type === 'emoji') {
    el.style.backgroundImage = '';
    el.style.background = 'linear-gradient(135deg, #0997ff, #003dd7)';
    el.textContent = av.value;
  } else {
    el.style.background = '#ece9d8';
    el.style.backgroundImage = `url(${JSON.stringify(av.value)})`;
  }
}

function applyMyAvatar() {
  applyAvatarToEl(document.getElementById('my-avatar'), getMyAvatar());
}

function buildProfilePanelHtml() {
  const thumbs = PRESET_AVATARS.map((a) => {
    if (a.emoji) {
      return `<div class="avatar-thumb" data-avatar-id="${a.id}" title="Avatar">${a.emoji}</div>`;
    }
    return `<div class="avatar-thumb" data-avatar-id="${a.id}" style="background-image:url('${assetPath(a.file)}')" title="Avatar"></div>`;
  }).join('');
  return `
    <div class="avatar-grid">${thumbs}</div>
    <div class="profile-custom">
      <input type="file" class="bg-file-input" id="avatar-file-input" accept="image/*" />
      <button type="button" class="xp-btn" id="avatar-upload-btn">📁 Eigen foto kiezen...</button>
    </div>`;
}

function setupProfilePanel() {
  const panel = document.getElementById('profile-panel');
  panel.innerHTML = buildProfilePanelHtml();
  const fileInput = document.getElementById('avatar-file-input');

  document.getElementById('my-avatar')?.addEventListener('click', () => {
    panel.classList.toggle('open');
    const saved = getMyAvatar();
    panel.querySelectorAll('.avatar-thumb').forEach((t) => t.classList.remove('selected'));
    if (saved?.startsWith('preset:')) {
      panel.querySelector(`[data-avatar-id="${saved.slice(7)}"]`)?.classList.add('selected');
    }
  });

  panel.querySelectorAll('.avatar-thumb').forEach((thumb) => {
    thumb.addEventListener('click', () => {
      panel.querySelectorAll('.avatar-thumb').forEach((t) => t.classList.remove('selected'));
      thumb.classList.add('selected');
      setMyAvatar(`preset:${thumb.dataset.avatarId}`);
    });
  });

  document.getElementById('avatar-upload-btn')?.addEventListener('click', () => fileInput?.click());

  fileInput?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (!file || !file.type.startsWith('image/')) return;
    if (file.size > 3 * 1024 * 1024) {
      alert('Profielfoto te groot (max 3 MB).');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      setMyAvatar(reader.result);
      panel.querySelectorAll('.avatar-thumb').forEach((t) => t.classList.remove('selected'));
      panel.classList.remove('open');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  applyMyAvatar();
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function sendAttachment(contactId, file, caption) {
  const isImage = file.type.startsWith('image/');
  if (file.size > MAX_FILE_SIZE) {
    addSystemMessage(contactId, `Bestand te groot (max ${MAX_FILE_SIZE / 1024 / 1024} MB).`);
    return;
  }

  readFileAsDataUrl(file).then((dataUrl) => {
    const msg = {
      role: 'user',
      contactId,
      time: formatTime(),
      type: isImage ? 'image' : 'file',
      fileName: file.name,
      mimeType: file.type || 'application/octet-stream',
      dataUrl,
      text: caption || '',
    };
    conversations[contactId].push(msg);
    const area = document.getElementById('msgs-' + contactId);
    if (area) appendMessageEl(area, msg);

    const contact = CONTACTS.find((c) => c.id === contactId);
    if (!contact) return;

    const apiText = isImage
      ? (caption || `[Ik stuur een foto: ${file.name}]`)
      : (caption || `[Ik stuur een bestand: ${file.name}]`);

    sendMessage(contactId, apiText, { skipUserBubble: true });
  }).catch(() => {
    addSystemMessage(contactId, 'Bestand kon niet worden gelezen.');
  });
}

function messageToApiContent(m) {
  if (m.type === 'image') {
    return m.text?.trim() || `[Foto: ${m.fileName}]`;
  }
  if (m.type === 'file') {
    return m.text?.trim() || `[Bestand: ${m.fileName}]`;
  }
  return m.text || '';
}

function setupChatExtras(win, contactId) {
  const bgPanel = win.querySelector(`[data-panel="bg-${contactId}"]`);
  const emoPanel = win.querySelector(`[data-panel="emo-${contactId}"]`);
  const input = win.querySelector('.chat-input');
  const bgFileInput = win.querySelector(`#bg-file-${contactId}`);
  const chatFileInput = win.querySelector(`#chat-file-${contactId}`);

  win.querySelectorAll('[data-panel-toggle]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const panelId = btn.dataset.panelToggle;
      const panel = win.querySelector(`[data-panel="${panelId}"]`);
      const isOpen = panel?.classList.contains('open');
      closeChatPanels(null);
      if (!isOpen && panel) {
        panel.classList.add('open');
        btn.classList.add('active');
      }
    });
  });

  win.querySelectorAll('[data-input-panel-toggle]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const panelId = btn.dataset.inputPanelToggle;
      const panel = win.querySelector(`[data-panel="${panelId}"]`);
      const isOpen = panel?.classList.contains('open');
      closeChatPanels(null);
      if (!isOpen && panel) {
        panel.classList.add('open');
        btn.classList.add('active');
      }
    });
  });

  win.querySelector(`[data-send-file="${contactId}"]`)?.addEventListener('click', () => {
    chatFileInput?.click();
  });

  chatFileInput?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const caption = input.value.trim();
    input.value = '';
    sendAttachment(contactId, file, caption);
    e.target.value = '';
  });

  bgPanel?.querySelectorAll('.bg-thumb').forEach((thumb) => {
    thumb.addEventListener('click', () => {
      const bgId = thumb.dataset.bgId;
      bgPanel.querySelectorAll('.bg-thumb').forEach((t) => t.classList.remove('selected'));
      thumb.classList.add('selected');
      if (bgId === 'white') {
        setChatBackground(contactId, 'white');
      } else {
        setChatBackground(contactId, `preset:${bgId}`);
      }
    });
  });

  win.querySelector(`[data-bg-upload="${contactId}"]`)?.addEventListener('click', () => {
    bgFileInput?.click();
  });

  bgFileInput?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (!file || !file.type.startsWith('image/')) return;
    if (file.size > 3 * 1024 * 1024) {
      addSystemMessage(contactId, 'Afbeelding te groot (max 3 MB).');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      setChatBackground(contactId, reader.result);
      bgPanel?.querySelectorAll('.bg-thumb').forEach((t) => t.classList.remove('selected'));
      addSystemMessage(contactId, 'Eigen achtergrond ingesteld.');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  emoPanel?.querySelectorAll('.emoticon-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      insertAtCursor(input, btn.dataset.emoji);
      emoPanel.classList.remove('open');
      win.querySelector(`[data-input-panel-toggle="emo-${contactId}"]`)?.classList.remove('active');
    });
  });

  applyChatBackground(contactId);
  const saved = getChatBackground(contactId);
  if (saved?.startsWith('preset:')) {
    const id = saved.slice(7);
    bgPanel?.querySelector(`[data-bg-id="${id}"]`)?.classList.add('selected');
  } else if (!saved || saved === 'white') {
    bgPanel?.querySelector('[data-bg-id="white"]')?.classList.add('selected');
  }
}

function bringToFront(el) {
  topZ += 1;
  el.style.zIndex = topZ;
  el.classList.add('active');
  document.querySelectorAll('.msn-window').forEach((w) => {
    if (w !== el) w.classList.remove('active');
    const tb = w.querySelector('.titlebar');
    if (tb) tb.classList.toggle('inactive', w !== el);
  });
  const tb = el.querySelector('.titlebar');
  if (tb) tb.classList.remove('inactive');
}

function openChat(contactId) {
  const contact = CONTACTS.find((c) => c.id === contactId);
  if (!contact) return;

  if (chatWindows[contactId]) {
    const win = chatWindows[contactId];
    win.classList.remove('hidden', 'minimized');
    bringToFront(win);
    applyChatBackground(contactId);
    win.querySelector('.chat-input')?.focus();
    return;
  }

  windowOffset = (windowOffset + 32) % 160;
  const pos = getChatWindowPosition(windowOffset);

  const win = document.createElement('div');
  win.className = 'msn-window chat-window';
  win.id = 'chat-' + contactId;
  win.style.left = pos.left + 'px';
  win.style.top = pos.top + 'px';
  win.style.width = pos.width + 'px';
  win.style.height = pos.height + 'px';
  win.style.zIndex = ++topZ;

  win.innerHTML = `
    <div class="titlebar inactive" data-drag="${win.id}">
      <span class="titlebar-text">${contact.emoji} ${escapeHtml(contact.name)}</span>
      <div class="titlebar-btns">
        <button class="win-btn" type="button" data-minimize="${win.id}">_</button>
        <button class="win-btn close" type="button" data-close="${win.id}">×</button>
      </div>
    </div>
    <div class="window-body">
      <div class="chat-toolbar">
        <button class="xp-btn nudge-btn" type="button" data-nudge="${contactId}">📳 Nudge!</button>
        <button class="xp-btn" type="button" data-panel-toggle="bg-${contactId}">🖼 Achtergrond</button>
      </div>
      ${buildBgPanelHtml(contactId)}
      <div class="chat-messages-wrap">
        <div class="chat-messages" id="msgs-${contactId}"></div>
      </div>
      <div class="typing-indicator" id="typing-${contactId}"></div>
      <div class="chat-input-area">
        <input type="file" class="bg-file-input" id="chat-file-${contactId}" accept="image/*,*/*" />
        <div class="chat-input-row">
          <div class="chat-input-tools">
            <button type="button" class="xp-btn chat-tool-btn" data-input-panel-toggle="emo-${contactId}" title="Emoticon">😊</button>
            <button type="button" class="xp-btn chat-tool-btn" data-send-file="${contactId}" title="Foto of bestand sturen">📎</button>
          </div>
          <div class="chat-input-wrap">
            ${buildEmoPanelHtml(contactId)}
            <textarea class="chat-input" id="input-${contactId}" placeholder="Typ een bericht..."></textarea>
          </div>
          <button class="xp-btn send-btn" type="button" id="send-${contactId}">Verstuur</button>
        </div>
      </div>
      <div class="statusbar">${escapeHtml(contact.statusLabel)}</div>
    </div>
  `;

  document.getElementById('desktop').appendChild(win);
  chatWindows[contactId] = win;

  const history = conversations[contactId];
  if (history.length === 0) {
    addSystemMessage(contactId, `Je bent nu aan het chatten met ${contact.name}.`);
  } else {
    renderMessages(contactId);
  }

  win.addEventListener('mousedown', () => bringToFront(win));

  win.querySelector('[data-nudge]').addEventListener('click', () => nudgeWindow(contactId));
  win.querySelector('[data-close]').addEventListener('click', () => {
    win.classList.add('hidden');
  });
  win.querySelector('[data-minimize]').addEventListener('click', () => {
    win.classList.toggle('minimized');
  });

  const input = win.querySelector('.chat-input');
  const sendBtn = win.querySelector('.send-btn');

  const doSend = () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendMessage(contactId, text);
  };

  sendBtn.addEventListener('click', doSend);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      doSend();
    }
  });

  setupDrag(win);
  setupChatExtras(win, contactId);
  bringToFront(win);
  setSelectedBuddy(contactId);
  input.focus();
}

function getChatWindowPosition(offset) {
  const buddy = document.getElementById('buddy-window');
  const buddyLeft = buddy ? buddy.getBoundingClientRect().left : window.innerWidth - 280;
  const width = Math.min(480, buddyLeft - 48);
  const height = Math.min(620, window.innerHeight - 32);
  const left = Math.max(16, buddyLeft - width - 16 - (offset % 80));
  const top = 16 + offset;
  return { left, top, width, height };
}

function setSelectedBuddy(contactId) {
  document.querySelectorAll('.buddy-item').forEach((el) => {
    el.classList.toggle('selected', el.dataset.id === contactId);
  });
}

function addSystemMessage(contactId, text) {
  const area = document.getElementById('msgs-' + contactId);
  if (!area) return;
  const line = document.createElement('div');
  line.className = 'msg-system';
  line.textContent = text;
  area.appendChild(line);
  area.scrollTop = area.scrollHeight;
}

function renderMessages(contactId) {
  const area = document.getElementById('msgs-' + contactId);
  if (!area) return;
  area.innerHTML = '';
  conversations[contactId].forEach((msg) => {
    appendMessageEl(area, msg);
  });
  area.scrollTop = area.scrollHeight;
}

function appendMessageEl(area, msg) {
  const line = document.createElement('div');
  line.className = 'msg-line';
  if (msg.role === 'system') {
    line.className = 'msg-system';
    line.textContent = msg.text;
  } else {
    const isMe = msg.role === 'user';
    const contact = CONTACTS.find((c) => c.id === msg.contactId);
    const name = isMe ? 'Jij' : (contact ? contact.name : 'Contact');
    const nameClass = isMe ? 'me' : 'them';
    const header = `<span class="msg-time">[${msg.time}]</span><span class="msg-name ${nameClass}">${escapeHtml(name)}:</span>`;

    if (msg.type === 'image' && msg.dataUrl) {
      const caption = msg.text?.trim()
        ? `<span class="msg-caption">${formatMessageContent(msg.text)}</span>`
        : '';
      line.innerHTML = `${header} ${caption}<img class="msg-image" src="${msg.dataUrl}" alt="${escapeHtml(msg.fileName || 'foto')}" title="Klik om te vergroten" />`;
      line.querySelector('.msg-image')?.addEventListener('click', () => window.open(msg.dataUrl));
    } else if (msg.type === 'file' && msg.dataUrl) {
      const caption = msg.text?.trim()
        ? `<span class="msg-caption">${formatMessageContent(msg.text)}</span> `
        : '';
      line.innerHTML = `${header} ${caption}<a class="msg-file" href="${msg.dataUrl}" download="${escapeHtml(msg.fileName || 'bestand')}">📎 ${escapeHtml(msg.fileName || 'bestand')}</a>`;
    } else {
      line.innerHTML = `${header} ${formatMessageContent(msg.text || '')}`;
    }
  }
  area.appendChild(line);
}

function setTyping(contactId, active, label) {
  const el = document.getElementById('typing-' + contactId);
  if (!el) return;
  el.classList.toggle('active', active);
  el.textContent = active ? (label || 'aan het typen...') : '';
}

function nudgeWindow(contactId) {
  const win = chatWindows[contactId];
  const contact = CONTACTS.find((c) => c.id === contactId);
  if (!win || !contact) return;

  win.classList.remove('nudging');
  void win.offsetWidth;
  win.classList.add('nudging');
  bringToFront(win);

  addSystemMessage(contactId, `📳 Je hebt ${contact.name} een nudge gestuurd!`);

  setTimeout(() => win.classList.remove('nudging'), 600);

  if (!conversations[contactId].some((m) => m.pendingNudge)) {
    const nudgeReply = getNudgeReply(contact);
    setTimeout(() => {
      const botMsg = {
        role: 'assistant',
        contactId,
        text: nudgeReply,
        time: formatTime(),
      };
      conversations[contactId].push(botMsg);
      const area = document.getElementById('msgs-' + contactId);
      if (area) appendMessageEl(area, botMsg);
    }, 400);
  }
}

function getNudgeReply(contact) {
  const replies = {
    claude: 'Hey! :) Je hebt me een nudge gestuurd — wat kan ik voor je doen?',
    lisa: 'OMG stop met nudgen!! 😂 xoxo',
    jeroen: 'WTF man ik zit in een match!! ff niet nudgen -_-',
    sanne: 'OMG IK BEN BEZET!!! ...ok wat wil je dan 🙄',
  };
  return replies[contact.id] || 'Hey!';
}

async function sendMessage(contactId, text, options = {}) {
  const contact = CONTACTS.find((c) => c.id === contactId);
  if (!contact) return;

  const area = document.getElementById('msgs-' + contactId);

  if (!options.skipUserBubble) {
    const userMsg = { role: 'user', contactId, text, time: formatTime(), type: 'text' };
    conversations[contactId].push(userMsg);
    if (area) appendMessageEl(area, userMsg);
  }

  const apiMessages = conversations[contactId]
    .filter((m) => m.role === 'user' || m.role === 'assistant')
    .map((m) => ({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: messageToApiContent(m),
    }));

  setTyping(contactId, true, `${contact.name} is aan het typen...`);

  const sendBtn = document.getElementById('send-' + contactId);
  const input = document.getElementById('input-' + contactId);
  if (sendBtn) sendBtn.disabled = true;
  if (input) input.disabled = true;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01',
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 512,
        system: contact.system,
        messages: apiMessages,
      }),
    });

    const data = await response.json();

    if (!response.ok) {
      const apiErr =
        data.message ||
        (typeof data.error === 'object' ? data.error?.message : null) ||
        (typeof data.error === 'string' ? data.error : null) ||
        `API-fout ${response.status}`;
      throw new Error(apiErr);
    }

    const replyText = data.content
      ?.filter((block) => block.type === 'text')
      .map((block) => block.text)
      .join('') || '(geen antwoord)';

    const botMsg = {
      role: 'assistant',
      contactId,
      text: replyText.trim(),
      time: formatTime(),
    };
    conversations[contactId].push(botMsg);
    if (area) appendMessageEl(area, botMsg);
  } catch (err) {
    const errMsg = {
      role: 'system',
      text: 'Fout: ' + (err.message || 'Kon geen verbinding maken met de server.'),
      time: formatTime(),
    };
    if (area) appendMessageEl(area, errMsg);
  } finally {
    setTyping(contactId, false);
    if (sendBtn) sendBtn.disabled = false;
    if (input) {
      input.disabled = false;
      input.focus();
    }
    if (area) area.scrollTop = area.scrollHeight;
  }
}

function setupDrag(win) {
  const titlebar = win.querySelector('[data-drag]');
  if (!titlebar) return;

  let dragging = false;
  let startX, startY, startLeft, startTop;

  titlebar.addEventListener('mousedown', (e) => {
    if (e.target.closest('.win-btn')) return;
    dragging = true;
    bringToFront(win);
    startX = e.clientX;
    startY = e.clientY;
    startLeft = win.offsetLeft;
    startTop = win.offsetTop;
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    win.style.left = startLeft + (e.clientX - startX) + 'px';
    win.style.top = startTop + (e.clientY - startY) + 'px';
  });

  document.addEventListener('mouseup', () => {
    dragging = false;
  });
}

});

document.getElementById('buddy-list').addEventListener('click', (e) => {
  const item = e.target.closest('.buddy-item');
  if (!item?.dataset.id) return;
  e.stopPropagation();
  openChat(item.dataset.id);
});

window.addEventListener('resize', () => {
  Object.keys(chatWindows).forEach((id, i) => {
    const win = chatWindows[id];
    if (win.classList.contains('hidden')) return;
    const pos = getChatWindowPosition(i * 32);
    win.style.left = pos.left + 'px';
    win.style.top = pos.top + 'px';
    win.style.width = pos.width + 'px';
    win.style.height = pos.height + 'px';
  });
});

document.addEventListener('mousedown', (ev) => {
  if (
    !ev.target.closest('.chat-panel') &&
    !ev.target.closest('[data-panel-toggle]') &&
    !ev.target.closest('.chat-input-panel') &&
    !ev.target.closest('[data-input-panel-toggle]') &&
    !ev.target.closest('.chat-input-tools')
  ) {
    closeChatPanels(null);
  }
  if (!ev.target.closest('#my-avatar') && !ev.target.closest('#profile-panel')) {
    document.getElementById('profile-panel')?.classList.remove('open');
  }
});

setupProfilePanel();
renderBuddyList();
</script>
</body>
</html>
